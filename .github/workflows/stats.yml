name: Actualizar Tarjetas del README
on:
  schedule:
    - cron: "0 3 * * *" # Se ejecuta automáticamente todos los días a las 3 AM
  workflow_dispatch: # Te permite ejecutarlo manualmente cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generar tarjeta de estadísticas
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=dagdmfc1946&show_icons=true&theme=radical&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar tarjeta de lenguajes
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=dagdmfc1946&layout=compact&theme=radical&langs_count=6
          path: profile/langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar tarjetas en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@://github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
